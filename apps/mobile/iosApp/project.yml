name: SorriPrecosIOS
options:
  bundleIdPrefix: br.com.sorriprecos
  deploymentTarget:
    iOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    ENABLE_USER_SCRIPT_SANDBOXING: 'NO'
    GENERATE_INFOPLIST_FILE: 'YES'
    INFOPLIST_KEY_CFBundleDisplayName: SorriPreços
    INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
    FRAMEWORK_SEARCH_PATHS: '$(inherited) $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)'
    OTHER_LDFLAGS: '$(inherited) -framework SorriPrecos'
targets:
  SorriPrecosIOS:
    type: application
    platform: iOS
    sources:
      - SorriPrecosApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.sorriprecos.ios
    preBuildScripts:
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
